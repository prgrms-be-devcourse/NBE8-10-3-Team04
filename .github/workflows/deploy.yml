name: Deploy Blue-Green

on:
  push:
    branches: [ main ]
  # GitHub Actions UI에서 현재 브랜치를 선택해 수동 배포 테스트할 때 사용
  workflow_dispatch:

env:
  # 퍼블릭 IP 기반 운영 값입니다. 인스턴스 IP가 바뀌면 이 값도 함께 수정해야 합니다.
  PUBLIC_API_BASE_URL: http://100.53.52.159/api

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build backend jar
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew bootJar -x test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        run: |
          echo "backend_image=ghcr.io/prgrms-be-devcourse/nbe8-10-3-team04/backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/prgrms-be-devcourse/nbe8-10-3-team04/frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}
            ghcr.io/prgrms-be-devcourse/nbe8-10-3-team04/backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.PUBLIC_API_BASE_URL }}
          tags: |
            ${{ steps.meta.outputs.frontend_image }}
            ghcr.io/prgrms-be-devcourse/nbe8-10-3-team04/frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy on AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_SERVER_HOST }}
          username: ec2-user
          key: ${{ secrets.AWS_SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ec2-user/app

            cat > .env.deploy <<EOF
            BACKEND_IMAGE=${{ needs.build-and-push.outputs.backend_image }}
            FRONTEND_IMAGE=${{ needs.build-and-push.outputs.frontend_image }}
            NEXT_PUBLIC_API_BASE_URL=${{ env.PUBLIC_API_BASE_URL }}
            MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_APP_USER=${{ secrets.MYSQL_APP_USER }}
            MYSQL_APP_PASSWORD=${{ secrets.MYSQL_APP_PASSWORD }}
            AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}
            AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}
            AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            EOF

            chmod +x deploy/scripts/*.sh
            ./deploy/scripts/deploy.sh
