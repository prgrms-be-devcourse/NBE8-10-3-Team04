name: Deploy Backend Only

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-backend-only
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build backend jar
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew bootJar -x test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set backend image metadata
        id: meta
        run: |
          echo "backend_image=ghcr.io/prgrms-be-devcourse/nbe8-10-3-team04/backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}
            ghcr.io/prgrms-be-devcourse/nbe8-10-3-team04/backend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy backend on AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_SERVER_HOST }}
          username: ec2-user
          key: ${{ secrets.AWS_SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            mkdir -p /home/ec2-user/app
            cd /home/ec2-user/app

            # GHCR private 패키지 pull 인증
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            # 백엔드 단독 실행용 환경변수 파일
            cat > backend.env <<EOF
            SPRING_PROFILES_ACTIVE=dev
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}
            AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}
            AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            EOF

            docker pull "${{ needs.build-and-push.outputs.backend_image }}"
            docker stop team04-backend >/dev/null 2>&1 || true
            docker rm team04-backend >/dev/null 2>&1 || true

            docker run -d \
              --name team04-backend \
              --restart unless-stopped \
              --env-file /home/ec2-user/app/backend.env \
              -p 8080:8080 \
              "${{ needs.build-and-push.outputs.backend_image }}"

            # 기동 확인
            ok=0
            for i in $(seq 1 20); do
              if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
                echo "backend healthcheck: OK"
                ok=1
                break
              fi
              sleep 3
            done
            if [ "$ok" -ne 1 ]; then
              echo "backend healthcheck: FAIL"
              docker logs --tail 200 team04-backend || true
              exit 1
            fi

            docker ps --filter "name=team04-backend"
