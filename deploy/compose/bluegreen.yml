services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-appdb}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - app-net

  backend-blue:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file:
      - ../../.env.deploy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_COLOR: blue
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - app-net

  backend-green:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file:
      - ../../.env.deploy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_COLOR: green
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - app-net

  frontend-blue:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    env_file:
      - ../../.env.deploy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      APP_COLOR: blue
    depends_on:
      - backend-blue
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 > /dev/null"]
      interval: 20s
      timeout: 5s
      retries: 20
    networks:
      - app-net

  frontend-green:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    env_file:
      - ../../.env.deploy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      APP_COLOR: green
    depends_on:
      - backend-green
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 > /dev/null"]
      interval: 20s
      timeout: 5s
      retries: 20
    networks:
      - app-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend-blue
      - frontend-green
      - backend-blue
      - backend-green
    networks:
      - app-net

volumes:
  mysql-data: {}

networks:
  app-net: {}
